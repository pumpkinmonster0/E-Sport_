
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Tournament Details"
    >

    <title>Tournament Details | E-Sports</title>


    <!-- =====================================================
         EXISTING EXTERNAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div id="pageContent">


    <div class="screen-area">


        <div
            class="screen-content"
            id="screenContent"
        >


            <!-- =================================================
                 BACK BUTTON
            ================================================== -->

            <p>

                <a
                    href="schedule.html"
                    class="card-btn"
                >
                    ← Back to Schedule
                </a>

            </p>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1 id="eventTitle">
                Tournament Details
            </h1>


            <p
                id="eventDescription"
                class="text-muted"
            >
                Loading tournament information...
            </p>


            <!-- =================================================
                 STATUS
            ================================================== -->

            <div class="match-info">

                <span
                    id="eventStatus"
                    class="match-badge"
                >
                    -
                </span>

            </div>


            <hr>


            <!-- =================================================
                 TOURNAMENT DETAILS
            ================================================== -->

            <h2 class="schedule-title">
                🎮 Tournament Details
            </h2>


            <div class="cards-container">


                <!-- GAME -->

                <div class="event-card">

                    <div class="card-image">

                        <span
                            class="card-icon"
                            id="gameIcon"
                        >
                            🎮
                        </span>

                    </div>


                    <div class="card-body">

                        <h3>
                            Game
                        </h3>


                        <p
                            class="card-desc"
                            id="eventGame"
                        >
                            -
                        </p>

                    </div>

                </div>


                <!-- DATE -->

                <div class="event-card">

                    <div class="card-image">

                        <span class="card-icon">
                            📅
                        </span>

                    </div>


                    <div class="card-body">

                        <h3>
                            Date
                        </h3>


                        <p
                            class="card-desc"
                            id="eventDate"
                        >
                            -
                        </p>

                    </div>

                </div>


                <!-- TIME -->

                <div class="event-card">

                    <div class="card-image">

                        <span class="card-icon">
                            🕒
                        </span>

                    </div>


                    <div class="card-body">

                        <h3>
                            Time
                        </h3>


                        <p
                            class="card-desc"
                            id="eventTime"
                        >
                            -
                        </p>

                    </div>

                </div>


                <!-- ROUND -->

                <div class="event-card">

                    <div class="card-image">

                        <span class="card-icon">
                            🏆
                        </span>

                    </div>


                    <div class="card-body">

                        <h3>
                            Round
                        </h3>


                        <p
                            class="card-desc"
                            id="eventRound"
                        >
                            -
                        </p>

                    </div>

                </div>


            </div>


            <!-- =================================================
                 MATCH INFORMATION
            ================================================== -->

            <h2 class="schedule-title">
                ⚔️ Match Information
            </h2>


            <div class="event-card">

                <div class="card-body">

                    <h3 id="matchTitle">
                        Match
                    </h3>


                    <p
                        class="card-desc"
                        id="matchDescription"
                    >
                        -
                    </p>

                </div>

            </div>


            <!-- =================================================
                 EVENT STATUS
            ================================================== -->

            <h2 class="schedule-title">
                📢 Event Status
            </h2>


            <div class="event-card">

                <div class="card-body">

                    <h3 id="statusTitle">
                        Status
                    </h3>


                    <p
                        class="card-desc"
                        id="statusMessage"
                    >
                        -
                    </p>

                </div>

            </div>


            <!-- =================================================
                 BACK BUTTON
            ================================================== -->

            <p>

                <a
                    href="schedule.html"
                    class="card-btn"
                >
                    ← Back to Schedule
                </a>

            </p>


        </div>

    </div>

</div>



<!-- =====================================================
     EXISTING JAVASCRIPT FILES
====================================================== -->

<script src="js/navbar.js"></script>
<script src="js/shell.js"></script>
<script src="js/footer.js"></script>
<script src="js/neon.js"></script>
<script src="js/scroll-reveal.js"></script>
<script src="js/main.js"></script>



<!-- =====================================================
     TOURNAMENT DETAIL JAVASCRIPT
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================

           IMPORTANT:

        ===================================================== */

        const events = {

            "2026-08-26": [

                {

                }

            ],


            "2026-08-27": [

                {
                    game: "CS-GO",
                    round: "FINAL",
                    status: "ON-GOING",
                    time: "19:30",
                    description:
                        "CS-GO championship final."
                }

            ],


            "2026-08-28": [

                {
                    game: "LOL",
                    round: "FINAL",
                    status: "FUTURE",
                    time: "20:00",
                    description:
                        "League of Legends championship final."
                }

            ],


            "2026-08-29": [

                {
                    game: "Dota 2",
                    round: "SEMI-FINAL",
                    status: "FUTURE",
                    time: "16:00",
                    description:
                        "Dota 2 semi-final tournament."
                }

            ],


            "2026-08-30": [

                {
                    game: "Valorant",
                    round: "FINAL",
                    status: "FUTURE",
                    time: "19:00",
                    description:
                        "Valorant championship final."
                }

            ],


            "2026-09-01": [

                {
                    game: "PUBG",
                    round: "SEMI-FINAL",
                    status: "ON-GOING",
                    time: "18:00",
                    description:
                        "PUBG semi-final match."
                }

            ],


            "2026-09-03": [

                {
                    game: "CS-GO",
                    round: "QUARTER-FINAL",
                    status: "FUTURE",
                    time: "20:00",
                    description:
                        "CS-GO quarter-final tournament."
                }

            ],


            "2026-09-05": [

                {
                    game: "Dota 2",
                    round: "FINAL",
                    status: "ON-GOING",
                    time: "15:30",
                    description:
                        "Dota 2 championship final."
                }

            ],


            "2026-09-07": [

                {
                    game: "PUBG",
                    round: "FINAL",
                    status: "FUTURE",
                    time: "17:00",
                    description:
                        "PUBG final tournament."
                }

            ],


            "2026-09-08": [

                {
                    game: "LOL",
                    round: "SEMI-FINAL",
                    status: "FUTURE",
                    time: "19:00",
                    description:
                        "League of Legends semi-final match."
                }

            ],


            "2026-09-09": [

                {
                    game: "CS-GO",
                    round: "SEMI-FINAL",
                    status: "ON-GOING",
                    time: "19:00",
                    description:
                        "CS-GO semi-final match."
                }

            ],


            "2026-09-10": [

                {
                    game: "Mobile Legends",
                    round: "SEMI-FINAL",
                    status: "FUTURE",
                    time: "18:00",
                    description:
                        "Mobile Legends semi-final tournament."
                }

            ],


            "2026-09-11": [

                {
                    game: "Dota 2",
                    round: "QUARTER-FINAL",
                    status: "FUTURE",
                    time: "21:00",
                    description:
                        "Dota 2 quarter-final match."
                }

            ],


            "2026-09-15": [

                {
                    game: "Mobile Legends",
                    round: "FINAL",
                    status: "FUTURE",
                    time: "19:00",
                    description:
                        "Mobile Legends championship final."
                }

            ]

        };


        /* =====================================================
           GAME ICONS
        ===================================================== */

        const gameIcons = {

            "PUBG":
                "🎯",

            "CS-GO":
                "🔫",

            "Dota 2":
                "⚔️",

            "Valorant":
                "🎯",

            "Rocket League":
                "🚗",

            "LOL":
                "🧙",

            "Mobile Legends":
                "⚔️"

        };


        /* =====================================================
           CREATE EVENT ID

           Must be exactly the same as schedule.html.
        ===================================================== */

        function createEventId(
            dateKey,
            event
        ) {

            return (

                dateKey
                +
                "_"
                +
                event.game
                    .trim()
                    .replace(
                        /\s+/g,
                        "-"
                    )
                +
                "_"
                +
                event.round

            );

        }


        /* =====================================================
           GET ID FROM URL
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requestedId =
            params.get(
                "id"
            );


        /* =====================================================
           FIND EVENT
        ===================================================== */

        let selectedEvent =
            null;


        let selectedDate =
            null;


        Object.keys(
            events
        )
        .forEach(
            function (dateKey) {

                events[
                    dateKey
                ].forEach(
                    function (event) {

                        const eventId =
                            createEventId(
                                dateKey,
                                event
                            );


                        if (
                            eventId ===
                            requestedId
                        ) {

                            selectedEvent =
                                event;


                            selectedDate =
                                dateKey;

                        }

                    }
                );

            }
        );


        /* =====================================================
           EVENT NOT FOUND
        ===================================================== */

        if (
            !selectedEvent
        ) {

            document.getElementById(
                "eventTitle"
            ).textContent =
                "Tournament Not Found";


            document.getElementById(
                "eventDescription"
            ).textContent =
                "The selected tournament could not be found. Please return to the schedule and select an Ongoing or Future event.";


            document.getElementById(
                "eventStatus"
            ).textContent =
                "NOT FOUND";


            document.getElementById(
                "eventGame"
            ).textContent =
                "-";


            document.getElementById(
                "eventDate"
            ).textContent =
                "-";


            document.getElementById(
                "eventTime"
            ).textContent =
                "-";


            document.getElementById(
                "eventRound"
            ).textContent =
                "-";


            return;

        }


        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDisplayDate(
            dateString
        ) {

            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );


            return date.toLocaleDateString(
                "en-MY",
                {
                    weekday:
                        "long",

                    day:
                        "numeric",

                    month:
                        "long",

                    year:
                        "numeric"
                }
            );

        }


        /* =====================================================
           DISPLAY GAME NAME
        ===================================================== */

        let gameName =
            selectedEvent.game;


        if (
            selectedEvent.game ===
            "LOL"
        ) {

            gameName =
                "League of Legends";

        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        document.title =
            gameName
            +
            " "
            +
            selectedEvent.round
            +
            " | Tournament Details";


        /* =====================================================
           EVENT TITLE
        ===================================================== */

        document.getElementById(
            "eventTitle"
        ).textContent =

            gameName
            +
            " "
            +
            selectedEvent.round
            +
            " Tournament";


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        document.getElementById(
            "eventDescription"
        ).textContent =
            selectedEvent.description;


        /* =====================================================
           GAME
        ===================================================== */

        document.getElementById(
            "eventGame"
        ).textContent =
            gameName;


        /* =====================================================
           GAME ICON
        ===================================================== */

        document.getElementById(
            "gameIcon"
        ).textContent =

            gameIcons[
                selectedEvent.game
            ]
            ||
            "🎮";


        /* =====================================================
           DATE
        ===================================================== */

        document.getElementById(
            "eventDate"
        ).textContent =
            formatDisplayDate(
                selectedDate
            );


        /* =====================================================
           TIME
        ===================================================== */

        document.getElementById(
            "eventTime"
        ).textContent =
            selectedEvent.time;


        /* =====================================================
           ROUND
        ===================================================== */

        document.getElementById(
            "eventRound"
        ).textContent =
            selectedEvent.round;


        /* =====================================================
           STATUS
        ===================================================== */

        const statusElement =
            document.getElementById(
                "eventStatus"
            );


        statusElement.textContent =
            selectedEvent.status;


        if (
            selectedEvent.status ===
            "ON-GOING"
        ) {

            statusElement.classList.add(
                "ongoing-badge"
            );

        }

        else {

            statusElement.classList.add(
                "future-badge"
            );

        }


        /* =====================================================
           MATCH TITLE
        ===================================================== */

        document.getElementById(
            "matchTitle"
        ).textContent =

            gameName
            +
            " "
            +
            selectedEvent.round;


        /* =====================================================
           MATCH DESCRIPTION
        ===================================================== */

        document.getElementById(
            "matchDescription"
        ).textContent =

            selectedEvent.description
            +
            " The match is scheduled for "
            +
            formatDisplayDate(
                selectedDate
            )
            +
            " at "
            +
            selectedEvent.time
            +
            ".";


        /* =====================================================
           STATUS TITLE
        ===================================================== */

        document.getElementById(
            "statusTitle"
        ).textContent =
            selectedEvent.status;


        /* =====================================================
           STATUS MESSAGE
        ===================================================== */

        if (
            selectedEvent.status ===
            "ON-GOING"
        ) {

            document.getElementById(
                "statusMessage"
            ).textContent =
                "🔴 This tournament is currently ongoing.";

        }

        else {

            document.getElementById(
                "statusMessage"
            ).textContent =
                "🟢 This tournament is scheduled as a future event.";

        }


        console.log(
            "Tournament loaded:",
            requestedId
        );


    }

);

</script>


</body>

</html>
