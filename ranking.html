        name="viewport"

        name="description"

         EXISTING WEBSITE CSS
    ====================================================== -->

    <link rel="stylesheet" href="css/style.css">


    <!-- =====================================================
         RANKING PAGE ONLY CSS
         
         IMPORTANT:
         Do NOT style .screen-area or .screen-content here.
         They are controlled by shell.js.
    ====================================================== -->

    <style>

        /* =====================================================
           GAME SELECTOR
        ====================================================== */

        .cards-container {

            width: 100%;

            max-width: 1050px;

            margin: 30px auto;

            padding: 0 20px;

            box-sizing: border-box;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

        }


        /* =====================================================
           GAME BUTTONS
        ====================================================== */

        .cards-container .card-btn {

            width: 100%;

            min-width: 0;

            min-height: 65px;

            padding: 15px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            white-space: normal;

            overflow-wrap: break-word;

            word-break: normal;

            cursor: pointer;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 900px) {

            .cards-container {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 16px;

                padding: 0 15px;

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .cards-container {

                grid-template-columns: 1fr;

                gap: 14px;

                padding: 0 15px;

                margin-top: 20px;

                margin-bottom: 25px;

            }


            .cards-container .card-btn {

                min-height: 58px;

                padding: 14px 12px;

                font-size: 15px;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ====================================================== */

        @media (max-width: 380px) {

            .cards-container {

                padding: 0 10px;

                gap: 12px;

            }


            .cards-container .card-btn {

                min-height: 55px;

                padding: 13px 10px;

                font-size: 14px;

            }

        }


        /* =====================================================
           RANKING TABLE
           
           Only the table itself may scroll horizontally.
           This prevents the whole screen/controller layout
           from being affected.
        ====================================================== */

        .table-container {

            width: 100%;

            max-width: 100%;

            box-sizing: border-box;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .table-container table {

            width: 100%;

            min-width: 620px;

            border-collapse: collapse;

        }


        /* =====================================================
           VIDEO
        ====================================================== */

        .highlight-video-mini {

            width: 100%;

            max-width: 100%;

            box-sizing: border-box;

        }


        .highlight-video-frame {

            width: 100%;

            max-width: 100%;

            box-sizing: border-box;

        }


        .highlight-video-frame iframe {

            display: block;

            width: 100%;

            max-width: 100%;

            box-sizing: border-box;

        }


        /* =====================================================
           MOBILE VIDEO
        ====================================================== */

        @media (max-width: 600px) {

            .highlight-video-frame {

                width: 100%;

            }

        }

    </style>

</head>

                            allowfullscreen

                    </div>


                </div>


            </div>


        </section>



        <!-- =================================================

        /* =====================================================
           DISPLAY RANKING
        ====================================================== */

        function showRanking(game) {


            const title =
                document.getElementById(
                    "rankingTitle"
                );


            const description =
                document.getElementById(
                    "rankingDescription"
                );


            const tableBody =
                document.getElementById(
                    "rankingTableBody"
                );


            const selectedRanking =
                rankings[game];


            /* =================================================
               CHECK RANKING DATA
            ================================================== */

            if (!selectedRanking) {

                tableBody.innerHTML = `

                    <tr>

                        <td colspan="6">

                            No ranking data available.

                        </td>

                    </tr>

                `;

                return;

            }



            /* =================================================
               UPDATE TITLE
            ================================================== */

            title.textContent =
                game + " Rankings";


            description.textContent =
                "Current " +
                game +
                " tournament rankings.";



            /* =================================================
               CLEAR OLD TABLE
            ================================================== */

            tableBody.innerHTML = "";



            /* =================================================
               ADD RANKING ROWS
            ================================================== */

            selectedRanking.forEach(
                function (player) {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>

                            ${getRankIcon(player.rank)}

                            ${player.rank}

                        </td>


                        <td>

                            <strong>

                                ${player.team}

                            </strong>

                        </td>


                        <td>

                            ${player.played}

                        </td>


                        <td>

                            ${player.wins}

                        </td>


                        <td>

                            ${player.losses}

                        </td>


                        <td>

                            <strong>

                                ${player.points}

                            </strong>

                        </td>

                    `;


                    tableBody.appendChild(row);

                }
            );



            /* =================================================
               UPDATE HIGHLIGHT VIDEO
            ================================================== */

            updateHighlightVideo(
                game,
                selectedRanking[0]
            );

        }



        /* =====================================================
           RANK ICON
        ====================================================== */

        function getRankIcon(rank) {


            if (rank === 1) {

                return "🥇";

            }


            if (rank === 2) {

                return "🥈";

            }


            if (rank === 3) {

                return "🥉";

            }


            return "";

        }



        /* =====================================================
           UPDATE HIGHLIGHT VIDEO
        ====================================================== */

        function updateHighlightVideo(
            game,
            topPlayer
        ) {


            const frame =
                document.getElementById(
                    "highlightVideoFrame"
                );


            const title =
                document.getElementById(
                    "highlightVideoTitle"
                );


            const videoId =
                highlightVideos[game];



            /* =================================================
               NO VIDEO AVAILABLE
            ================================================== */

            if (!videoId) {

                frame.src = "";

                title.textContent =
                    "🏆 Champion Highlight";

                return;

            }



            /* =================================================
               USE EXISTING YOUTUBE FUNCTION
            ================================================== */

            if (
                typeof window.setYouTubeVideo ===
                "function"
            ) {


                window.setYouTubeVideo(
                    "highlightVideoFrame",
                    videoId
                );


            }


            /* =================================================
               FALLBACK
            ================================================== */

            else {


                frame.src =
                    "https://www.youtube.com/embed/" +
                    videoId +
                    "?enablejsapi=1";


            }



            /* =================================================
               UPDATE VIDEO TITLE
            ================================================== */

            title.textContent =

                topPlayer

                    ? "🏆 " +
                      topPlayer.team +
                      " — Champion Highlight"

                    : "🏆 Champion Highlight";

        }

           INITIAL RANKING
        ====================================================== */
