<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCOUNT MANAGEMENT PAGE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="pageContent">

        <div class="container py-5">
            <div id="auth-section">
                <video class="bg-video" autoplay muted loop playsinline
                    poster="images/index/pexels-yankrukov-9072205.jpg">
                    <source src="images/account/The rise of a new rivalry. Esports Nations Cup.mp4" type="video/mp4">
                </video>
                <div class="auth-section-inner">
                    <h2 class="text-center mb-4"><strong>Membership & Team Management</strong></h2>

                    <!-- State current status -->
                    <div id="status-bar" class="alert alert-info text-center">
                        Current Status: Not Logged In
                    </div>

                    <!-- Login and SignUp button -->
                    <div id="auth-buttons" class="d-flex justify-content-center gap-3 mb-4">
                        <button id="show-login-btn" class="btn-generic primary large">Log In</button>
                        <button id="show-signin-btn" class="btn-generic large">Sign Up</button>
                    </div>

                    <!-- display the card after choosing the button -->
                    <div class="row justify-content-center">
                        <div class="col-md-6">

                            <!-- Log In card -->
                            <div id="login-card" class="card mb-4" style="display: none;">
                                <h4>Log In</h4>
                                <div class="mb-3">
                                    <label class="form-label">Username </label>
                                    <input type="text" id="login-username" class="form-control"
                                        placeholder="Enter username">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="login-password" class="form-control"
                                        placeholder="Enter password">
                                </div>
                                <button id="btn-do-login" class="btn-generic success full">Confirm Log-In</button>
                            </div>

                            <!-- Sign In card -->
                            <div id="signin-card" class="card mb-4" style="display: none;">
                                <h4>Sign Up</h4>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" id="signin-username" class="form-control"
                                        placeholder="Set username">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="signin-password" class="form-control"
                                        placeholder="Set password">
                                </div>
                                <button id="btn-do-signin" class="btn-generic primary full">Sign In Sucessfully!
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <hr class="my-5 border-secondary">
            <div id="team-section">


                <!-- Team create -->
                <div class="text-center mb-5">
                    <h3>Team</h3>
                    <p class="text-secondary">Please log in first...Before create your team.</p>
                    <button id="create-team-btn" class="btn-generic danger large mt-2"> Create a Team </button>
                </div>

                <!-- display team which have created -->
                <h3 class="mb-3">🛡️ Team created</h3>
                <div id="team-list">
                    <!-- JS  -->
                </div>
            </div>

            <!-- Team created card -->
            <div class="modal fade" id="createTeamModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content bg-dark text-white border-secondary">
                        <video class="bg-video" autoplay muted loop playsinline
                            poster="images/index/istockphoto-2201247639-1024x1024.jpg">
                            <source src="images/account/The rise of a new rivalry. Esports Nations Cup.mp4"
                                type="video/mp4">
                        </video>
                        <div class="modal-inner">
                            <div class="modal-header border-secondary">
                                <h5 class="modal-title">Create New Team</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form id="team-form">
                                    <div class="mb-3">
                                        <label class="form-label">Team Name</label>
                                        <input type="text" id="team-name"
                                            class="form-control bg-secondary text-white border-0"
                                            placeholder="Example: UTAR CyberDragons" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Game Category</label>
                                        <select id="team-game" class="form-select bg-secondary text-white border-0">
                                            <option value="Valorant">Valorant</option>
                                            <option value="League of Legends">League of Legends</option>
                                            <option value="Mobile Legends">Mobile Legends</option>
                                            <option value="Dota 2">Dota 2</option>
                                            <option value="PUBG">PUBG</option>
                                            <option value="CS-GO">CS-GO</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Team Leader</label>
                                        <input type="text" id="team-leader"
                                            class="form-control bg-secondary text-white border-0" readonly>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Team Members</label>
                                        <input type="text" id="team-members"
                                            class="form-control bg-secondary text-white border-0"
                                            placeholder="Example: PlayerA, PlayerB, PlayerC" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Team Description</label>
                                        <textarea id="team-desc" class="form-control bg-secondary text-white border-0"
                                            rows="2" placeholder="Team Description"></textarea>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer border-secondary">
                                <button type="button" class="btn-generic" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" id="btn-save-team" class="btn-generic danger">Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery & Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/acc.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/neon.js"></script>
    <script src="js/scroll-reveal.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
