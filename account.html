<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

    <body>
        <div id="pageContent">

        <div class="container py-5">
            <h2 class="text-center mb-4">Membership & Team Management</h2>

            <!-- 當前登入狀態提示區 -->
            <div id="status-bar" class="alert alert-info text-center">
                Current Status: Haven't Log In
            </div>

            <!-- 選擇模式按鈕 -->
            <div id="auth-buttons" class="d-flex justify-content-center gap-3 mb-4">
                <button id="show-login-btn" class="btn btn-primary btn-lg">Log In</button>
                <button id="show-signin-btn" class="btn btn-outline-light btn-lg">Sign In / Sign Up</button>
            </div>

            <!-- 表單卡片區 -->
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <!-- 1. Log In 表單 -->
                    <div id="login-card" class="card bg-secondary text-white p-4 mb-4" style="display: none;">
                        <h4>Log In</h4>
                        <div class="mb-3">
                            <label class="form-label">Username </label>
                            <input type="text" id="login-username" class="form-control" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="login-password" class="form-control"
                                placeholder="Enter password">
                        </div>
                        <button id="btn-do-login" class="btn btn-success w-100">Confirm log-in</button>
                    </div>

                    <!-- 2. Sign In (註冊) 表單 -->
                    <div id="signin-card" class="card bg-secondary text-white p-4 mb-4" style="display: none;">
                        <h4>Sign In / Sign Up</h4>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="signin-username" class="form-control" placeholder="Set username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="signin-password" class="form-control" placeholder="Set password">
                        </div>
                        <button id="btn-do-signin" class="btn btn-warning w-100">Sign In Sucessfully! </button>
                    </div>

                </div>
            </div>

            <hr class="my-5 border-secondary">

            <!-- 戰隊創建區 -->
            <div class="text-center mb-5">
                <h3>Team</h3>
                <p class="text-secondary">Before create your team, pls first log in your account.</p>
                <button id="create-team-btn" class="btn btn-danger btn-lg mt-2"> Create a Team </button>
            </div>

            <!-- 已創建戰隊展示區 -->
            <h3 class="mb-3">🛡️ Team created</h3>
            <div id="team-list" class="row g-4">
                <!-- 戰隊卡片會由 JS 動態渲染在這裡 -->
            </div>
        </div>

        <!-- 創建戰隊 Modal 彈出視窗 -->
        <div class="modal fade" id="createTeamModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bg-dark text-white border-secondary">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title">Create New Team</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="team-form">
                            <div class="mb-3">
                                <label class="form-label">Team Name</label>
                                <input type="text" id="team-name" class="form-control bg-secondary text-white border-0"
                                    placeholder="例: UTAR CyberDragons" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Game Category</label>
                                <select id="team-game" class="form-select bg-secondary text-white border-0">
                                    <option value="Valorant">Valorant</option>
                                    <option value="League of Legends">League of Legends</option>
                                    <option value="Mobile Legends">Mobile Legends</option>
                                    <option value="Dota 2">Dota 2</option>
                                    <option value="Dota 2">PUBG</option>
                                    <option value="Dota 2">CS-GO</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Team Leader</label>
                                <input type="text" id="team-leader"
                                    class="form-control bg-secondary text-white border-0" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Team Members</label>
                                <input type="text" id="team-members"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="例: PlayerA, PlayerB, PlayerC" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea id="team-desc" class="form-control bg-secondary text-white border-0" rows="2"
                                    placeholder="Team Description"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="btn-save-team" class="btn btn-danger">Confirm</button>
                    </div>
                </div>
            </div>
        </div>
</div>
<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="acc.js"></script>
<script src="js/shell.js"></script>
<script src="js/neon.js"></script>
<script src="js/scroll-reveal.js"></script>
<script src="js/main.js"></script>
</body>

</html>
