<body class="bg-bracket">

  <!-- Hero Section -->
  <section class="py-4">
    <div class="container">
      <div class="hero-card p-4">
        <a href="player.html" class="d-inline-block mb-3 text-decoration-none">← Back to roster</a>
        <div class="d-flex align-items-center gap-4 flex-wrap">
          <div class="avatar-ring d-flex align-items-center justify-content-center" style="width:90px;height:90px;">

          </div>
          <div>
            <span id="player-badge" class="badge mb-2 d-inline-block">Game · Role</span>
            <h1 id="player-name" class="m-0">Player Name</h1>
            <p id="player-headline" class="lead m-0 mt-1">Player headline brief...</p>

        </div>
      </div>
    </div>
  </section>

  <!-- Details Section -->

    <div class="container">
      <div class="stat-strip p-3 mb-4 d-flex justify-content-around text-center flex-wrap gap-3">

        <div><div id="stat-kd" class="num h3 m-0">0.00</div><div class="label small">K/D Ratio</div></div>
        <div><div id="stat-score" class="num h3 m-0">0</div><div class="label small">Avg. Score</div></div>
        <div><div id="stat-mvp" class="num h3 m-0">0</div><div class="label small">MVP Awards</div></div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-12">
          <div class="card p-4 h-100">
            <h3>About</h3>
            <p id="player-about">Player biography description...</p>
          </div>
        </div>
      </div>

      <!-- Share Profile Section -->
      <div class="share-section p-4">

        <p id="share-subtext" class="mb-3">Follow the club or share this profile with your own network.</p>

          <a id="share-fb" href="#" target="_blank" aria-label="Facebook">f</a>
          <a id="share-insta" href="#" target="_blank" aria-label="Instagram">IG</a>
