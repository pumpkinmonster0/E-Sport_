            //    MONTH NAMES
            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            //    STORAGE
            const FILTER_STORAGE_KEY = "esportsEventFilters";

            //    FORMAT DATE
            function formatDate(year, month, day) {
                return (
                    year + "-" +
                    String(month + 1).padStart(2, "0") + "-" +
                    String(day).padStart(2, "0")
                );
            }

            //    CREATE YEAR FILTER
            function createYearFilter() {
                const years = Object.keys(events)
                    .map(date => date.substring(0, 4))
                    .filter((year, index, array) => array.indexOf(year) === index)
                    .sort();

                years.forEach(function (year) {
                    $("<option>").val(year).text(year).appendTo($yearFilter);
                });
            }

            //    GET FILTERS
            function getFilters() {
                return {
                    month: $monthFilter.val() || "all",
                    year: $yearFilter.val() || "all",
                    game: $gameFilter.val() || "all"
                };
            }

            //    SAVE FILTERS
            function saveFilters() {
                try {
                    sessionStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(getFilters()));
                    console.log("✅ Filters saved:", getFilters());
                } catch (error) {
                    console.error("❌ Cannot save filters:", error);
                }
            }

            //    LOAD FILTERS
            function loadFilters() {
                try {
                    const saved = sessionStorage.getItem(FILTER_STORAGE_KEY);
                    if (!saved) {
                        console.log("ℹ️ No saved filters");
                        return;
                    }
                    const filters = JSON.parse(saved);
                    console.log("✅ Loaded filters:", filters);

                    /* MONTH */
                    if (filters.month !== undefined && $monthFilter.find(`option[value="${filters.month}"]`).length) {
                        $monthFilter.val(filters.month);
                    }
                    /* YEAR */
                    if (filters.year !== undefined && $yearFilter.find(`option[value="${filters.year}"]`).length) {
                        $yearFilter.val(filters.year);
                    }
                    /* GAME */
                    if (filters.game !== undefined && $gameFilter.find(`option[value="${filters.game}"]`).length) {
                        $gameFilter.val(filters.game);
                    }
                } catch (error) {
                    console.error("❌ Cannot load saved filters:", error);
                }
            }

            //   EVENT MATCH FILTER
            function eventMatchesFilter(dateKey, event) {
                const filters = getFilters();
                //    MONTH
                if (filters.month !== "all") {
                    const eventMonth = parseInt(dateKey.substring(5, 7), 10) - 1;
                    if (eventMonth !== parseInt(filters.month, 10)) {
                        return false;
                    }
                }
                //    YEAR
                if (filters.year !== "all") {
                    const eventYear = dateKey.substring(0, 4);
                    if (eventYear !== filters.year) {
                        return false;
                    }
                }
                //    GAME
                if (filters.game !== "all" && event.game !== filters.game) {
                    return false;
                }
                return true;
            }

            //    GET FILTERED EVENTS
            function getFilteredEvents() {
                const filtered = {};
                Object.keys(events).sort().forEach(function (dateKey) {
                    const matched = events[dateKey].filter(function (event) {
                        return eventMatchesFilter(dateKey, event);
                    });
                    if (matched.length > 0) {
                        filtered[dateKey] = matched;
                    }
                });
                return filtered;
            }

            //    CREATE CALENDAR EVENT
            function createCalendarEvent(event) {
                const $eventBox = $("<div>").addClass("calendar-event");

                $("<div>")
                    .addClass("calendar-event-title")
                    .text("🎮 " + event.game)
                    .appendTo($eventBox);

                $("<div>")
                    .addClass("calendar-event-time")
                    .text("🕒 " + event.time)
                    .appendTo($eventBox);

                $("<span>")
                    .addClass("calendar-event-status")
                    .text(event.round + " • " + event.status)
                    .appendTo($eventBox);

                $("<div>")
                    .addClass("calendar-event-description")
                    .text(event.description)
                    .appendTo($eventBox);

                return $eventBox;
            }

            //    RENDER CALENDAR
            function renderCalendar() {
                $calendar.empty();
                $monthYear.text(monthNames[currentMonth] + " " + currentYear);

                const firstDay = new Date(currentYear, currentMonth, 1).getDay();
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const filteredEvents = getFilteredEvents();
                let visibleEventCount = 0;

                /* EMPTY */
                for (let i = 0; i < firstDay; i++) {
                    $("<div>").addClass("empty-day").appendTo($calendar);
                }

                /* DAYS */
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = formatDate(currentYear, currentMonth, day);

                    const $dayElement = $("<div>").addClass("calendar-day");

                    /* NUMBER */
                    $("<div>").addClass("day-number").text(day).appendTo($dayElement);

                    /* EVENT */
                    if (filteredEvents[dateKey]) {
                        $dayElement.css("border", "2px solid #e94560");
                        filteredEvents[dateKey].forEach(function (event) {
                            visibleEventCount++;
                            $dayElement.append(createCalendarEvent(event));
                        });
                    } else {
                        $("<div>").addClass("no-event").text("No Event").appendTo($dayElement);
                    }

                    /* TODAY */
                    const today = new Date();
                    if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                        $dayElement.addClass("today");
                        $("<div>").addClass("today-label").text("TODAY").appendTo($dayElement);
                    }

                    /* CLICK */
                    $dayElement.on("click", function (e) {
                        e.stopPropagation();
                        $(".calendar-day.selected").removeClass("selected");
                        $dayElement.addClass("selected");
                    });

                    $calendar.append($dayElement);
                }

                /* NO RESULT */
                if (visibleEventCount === 0 && (getFilters().month !== "all" || getFilters().year !== "all" || getFilters().game !== "all")) {
                    $("<div>").addClass("no-result").text("🔍 No Result").appendTo($calendar);
                }

                updateFilterResult();
            }

            //    CREATE EVENT CARD
            function createEventCard(dateKey, event, isPast) {
                const $card = $("<div>").addClass("event-card");
                if (isPast) {
                    $card.addClass("past-event");
                }

                const date = new Date(dateKey + "T00:00:00");
                const month = monthNames[date.getMonth()].substring(0, 3).toUpperCase();
                const day = String(date.getDate()).padStart(2, "0");

                /* IMAGE */
                const $image = $("<div>")
                    .addClass("card-image")
                    .css("background", isPast ? "linear-gradient(135deg,#555,#1a1a2e)" : "linear-gradient(135deg,#e94560,#1a1a2e)");

                const $badge = $("<span>").addClass("card-badge").text(month + " " + day);
                const $icon = $("<span>").addClass("card-icon").text("🎮");
                $image.append($badge).append($icon);

                /* BODY */
                const $body = $("<div>").addClass("card-body");

                /* TITLE */
                const $title = $("<h3>").text(event.game);

                /* TIME */
                const $time = $("<p>").addClass("card-time").text("🕒 " + dateKey + " " + event.time);

                /* DESCRIPTION */
                const $desc = $("<p>").addClass("card-desc").text(event.description);

                /* INFO */
                const $info = $("<div>").addClass("match-info");

                /* ROUND */
                const $round = $("<span>").addClass("match-badge round-badge").text(event.round);

                /* STATUS */
                const $status = $("<span>").addClass("match-badge");
                if (event.status === "ENDED") {
                    $status.addClass("ended-badge");
                } else if (event.status === "ON-GOING") {
                    $status.addClass("ongoing-badge");
                } else {
                    $status.addClass("future-badge");
                }
                $status.text(event.status);

                $info.append($round).append($status);
                $body.append($title).append($time).append($desc).append($info);

                $card.append($image).append($body);
                return $card;
            }

            //    RENDER SCHEDULE
            function renderSchedule() {
                $upcomingContainer.empty();
                $pastContainer.empty();

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const filteredEvents = getFilteredEvents();
                let upcomingCount = 0;
                let pastCount = 0;

                Object.keys(filteredEvents).sort().forEach(function (dateKey) {
                    const eventDate = new Date(dateKey + "T00:00:00");
                    const isPast = eventDate < today;

                    filteredEvents[dateKey].forEach(function (event) {
                        const $card = createEventCard(dateKey, event, isPast);
                        if (isPast) {
                            $pastContainer.append($card);
                            pastCount++;
                        } else {
                            $upcomingContainer.append($card);
                            upcomingCount++;
                        }
                    });
                });

                /* NO UPCOMING */
                if (upcomingCount === 0) {
                    $("<div>").addClass("no-result").text("🔍 No Result").appendTo($upcomingContainer);
                }
                /* NO PAST */
                if (pastCount === 0) {
                    $("<div>").addClass("no-result").text("🔍 No Result").appendTo($pastContainer);
                }
            }

            //    FILTER RESULT
            function updateFilterResult() {
                const filteredEvents = getFilteredEvents();
                let count = 0;
                Object.keys(filteredEvents).forEach(function (dateKey) {
                    count += filteredEvents[dateKey].length;
                });

                const filters = getFilters();
                if (filters.month === "all" && filters.year === "all" && filters.game === "all") {
                    $filterResult.text("Showing all " + count + " events");
                    return;
                }
                $filterResult.text("Showing " + count + " event" + (count !== 1 ? "s" : ""));
            }

            //    APPLY FILTER
            function applyFilter() {
                console.log("🔎 Filter changed:", getFilters());
                saveFilters();
                renderCalendar();
                renderSchedule();
            }

            //    FILTER LISTENERS
            $monthFilter.on("change", applyFilter);
            $yearFilter.on("change", applyFilter);
            $gameFilter.on("change", applyFilter);

            //    CLEAR FILTER
            $clearFilter.on("click", function () {
                $monthFilter.val("all");
                $yearFilter.val("all");
                $gameFilter.val("all");
                saveFilters();
                renderCalendar();
                renderSchedule();
                console.log("🧹 Filters cleared");
            });

            //    PREVIOUS MONTH
            $prevMonth.on("click", function () {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar();
            });

            //    NEXT MONTH
            $nextMonth.on("click", function () {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar();
            });

            //    CLICK OUTSIDE
            $(document).on("click", function (e) {
                if (!$(e.target).closest(".calendar-day").length) {
                    $(".calendar-day.selected").removeClass("selected");
                }
            });

            //    START
            createYearFilter();
            loadFilters();
            renderCalendar();
            renderSchedule();
            console.log("Schedule ready");
        });
    </script>
</body>

</html>
